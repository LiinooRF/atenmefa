server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Astro genera /servicios/<slug>/index.html.
  # Sin pagina: 404 de verdad. Devolver la portada con 200 son "soft 404"
  # y Google los trata como contenido duplicado.
  location / {
    try_files $uri $uri/ $uri.html =404;
  }

  error_page 404 /404.html;
  location = /404.html { internal; }

  # Los nombres de _astro llevan hash: se pueden cachear para siempre.
  location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /robots.txt { expires 1h; }
  location ~* \.(xml)$ { expires 1h; }

  gzip on;
  gzip_vary on;
  gzip_min_length 512;
  gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options nosniff;
  add_header Referrer-Policy strict-origin-when-cross-origin;
}
